# ====================================================================
# Ergonomics & Sane Defaults
# ====================================================================

# Remap prefix from 'C-b' to 'C-a' (easier to reach, matching GNU Screen)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Start window and pane numbering at 1 instead of 0 (matches keyboard layout)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
# Enable mouse mode for quick scrolling, pane resizing, and clicking
set -g mouse on

# Increase scrollback buffer history (default is often too low)
set -g history-limit 50000

# Decrease command delay for snappier response times
set -s escape-time 0

# Don't rename windows automatically (prevent terminal commands from overriding your labels)
set-option -g allow-rename off

# ====================================================================
# Keybindings (Panes & Navigation)
# ====================================================================

# Split panes using '|' and '-' while preserving the current working directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Use Vim shortcuts (h, j, k, l) to switch panes without the prefix key
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ====================================================================
# Minimalist Aesthetics (No Plugins Required)
# ====================================================================

# Clean up the status bar (Subtle dark backgrounds with a single accent color)
set -g status-style bg=default,fg=white
set -g status-left '#[fg=green,bold]#S '
set -g status-right '#[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M'

# Match active and inactive window styling
set-window-option -g window-status-style fg=gray,bg=default
set-window-option -g window-status-current-style fg=brightred,bold,bg=default

# Muted, subtle pane borders (blends into modern editors like Neovim)
set -g pane-border-style fg=black
set -g pane-active-border-style fg=brightblack

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'

