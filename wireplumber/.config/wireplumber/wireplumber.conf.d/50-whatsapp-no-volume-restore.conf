# WebKit hands an <audio> element's volume to PipeWire as the stream volume,
# and WirePlumber then saves it as WhatsApp's volume for every later sound.
# One quiet clip (or a 0% one) silenced the app this way. Don't save or
# restore volume for WhatsApp streams; each one starts at 100%.
stream.rules = [
  {
    matches = [ { application.name = "WhatsApp" } ]
    actions = { update-props = { state.restore-props = false } }
  }
]
