# ==============================================================================
# REDDIT-APPROVED MINIMAL KITTY CONFIGURATION (kitty.conf format)
# ==============================================================================

# Window
window_padding_width 12

# Transparency (0.0 to 1.0)
background_opacity 0.90

# Default Startup Size
initial_window_width  80c
initial_window_height 30c
remember_window_size  no

# Font Settings
font_family      JetBrains Mono Regular
bold_font        JetBrains Mono Bold
italic_font      JetBrains Mono Italic
bold_italic_font JetBrains Mono Bold Italic
font_size        12.0

# Cursor Settings
cursor_shape beam
cursor_blink_interval 0

# Keybindings
map shift+enter send_text all \x1b\r


# BEGIN_KITTY_THEME
# Adwaita dark
include current-theme.conf
# END_KITTY_THEME

# Window decorations
# GNOME does not do server-side decorations on Wayland, so kitty draws its own
# titlebar (buttons always on the right, non-Adwaita look). Using the X11
# backend lets mutter draw the real GNOME headerbar, which honours the
# gnome-tweaks button layout (currently: close,minimize,maximize on the left).
linux_display_server x11

# Do not let the shell push "user@host:cwd" into the titlebar
shell_integration enabled no-title
